<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline — WH</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               font-family: system-ui, sans-serif; background: #f1f5f9; color: #334155; text-align: center; padding: 1.5rem; }
        .card { max-width: 22rem; }
        .icon { width: 72px; height: 72px; margin: 0 auto 1rem; }
        h1 { font-size: 1.15rem; margin: 0 0 .5rem; color: #0f172a; }
        p { font-size: .9rem; color: #64748b; margin: 0 0 1.25rem; line-height: 1.6; }
        button { background: #0284c7; color: #fff; border: 0; border-radius: .5rem; padding: .6rem 1.25rem;
                 font-size: .9rem; cursor: pointer; }
        button:hover { background: #0369a1; }
    </style>
</head>
<body>
    <div class="card">
        <img class="icon" src="/icons/icon-192.png" alt="WH" />
        <h1>ບໍ່ມີ ການເชື່ອมต่อ ອິນເຕີເນັດ</h1>
        <p>ໜ້ານີ້ ຕ້ອງการ อินเตอร์เน็ต. ກວດ ການເชื่อมต่อ ແລ້ວ ລອງໃໝ່ອีกครั้ง.</p>
        <button onclick="location.reload()">ລອງໃໝ່</button>
    </div>
</body>
</html>
